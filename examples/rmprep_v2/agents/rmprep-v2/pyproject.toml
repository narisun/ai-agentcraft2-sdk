[project]
name = "rmprep-v2"
version = "0.1.0"
description = "Prepare relationship manager client meeting memos and answer follow-up questions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agentcraft2-core[jwt,mcp,otel,serve]>=0.1,<0.2",
]

[project.scripts]
rmprep-v2 = "rmprep_v2.__main__:main"
rmprep-v2-serve = "rmprep_v2.service:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmprep_v2"]
