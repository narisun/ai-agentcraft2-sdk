# What the services of this workspace allow. The first rule that matches a
# request allows it; a request that no rule matches is denied.
#
# One document, two engines. In local development the in-process `rules`
# provider reads this file. A deployed service asks OPA, which loads the
# `policies` folder as a bundle (this file becomes `data.agentcraft2.rules`).
#
# This file is yours. agentcraft2 appends the rules a new service needs and never
# changes or removes a rule that is here.
schema: agentcraft2.rules/v1
rules:
  # The local developer inspector reads only this user's scoped agent turn.
  - id: rmprep-v2-staff-inspect-turns
    actions: [diagnostic.read]
    applications: [rmprep-v2]
    roles: [analyst, manager]
    resources: [rmprep-v2]

  # rmprep-v2-data: who may call its tools, and what each role sees of the data.
  # Analysts and managers may read the supplied snapshot. Each query caps pages
  # at 50 rows; the analyst policy also enforces that limit.
  - id: rmprep-v2-data-staff-call-the-tools
    actions: [tool.call]
    applications: [rmprep-v2-data]
    roles: [analyst, manager]
    resources: ["rmprep-v2-data/*"]
    max_classification: confidential

  - id: rmprep-v2-data-managers-see-everything
    actions: [data.query]
    applications: [rmprep-v2-data]
    roles: [manager]
    resources: ["rmprep_v2.*"]
    max_classification: confidential

  - id: rmprep-v2-data-analysts-read-the-data
    actions: [data.query]
    applications: [rmprep-v2-data]
    roles: [analyst]
    resources: ["rmprep_v2.*"]
    max_classification: confidential
    obligations:
      max_rows: 50

  # rmprep-v2: the models and tools it may use. A tool of an MCP server is
  # named <server>/<tool>; the server decides for itself what the caller may see.
  - id: rmprep-v2-uses-its-models
    actions: [model.route]
    applications: [rmprep-v2]
    resources: [default]

  - id: rmprep-v2-calls-rmprep-v2-data
    actions: [tool.call]
    applications: [rmprep-v2]
    resources: ["rmprep-v2-data/*"]
    max_classification: confidential
