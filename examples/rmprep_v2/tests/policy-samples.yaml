# Sample requests for the rules in policies/agentcraft2/rules/data.yaml.
# Each says who asks for what, and what the answer should be.
#
#   agentcraft2 policy test          decide them with the rules, as the services do locally
#   agentcraft2 policy test --opa    also with OPA, as deployed services do; the two must agree
#
# This file is yours. agentcraft2 appends samples for a new service and never
# changes or removes one that is here.
schema: agentcraft2.policy-samples/v1
samples:
  - name: an analyst calls a tool of rmprep-v2-data
    action: tool.call
    application: rmprep-v2-data
    resource: "rmprep-v2-data/rmprep-v2-data.get_memo_evidence"
    classification: confidential
    roles: [analyst]
    expect: allow
    reason: rmprep-v2-data-staff-call-the-tools

  - name: anyone else is denied at rmprep-v2-data
    action: tool.call
    application: rmprep-v2-data
    resource: "rmprep-v2-data/rmprep-v2-data.get_memo_evidence"
    classification: confidential
    roles: [intern]
    expect: deny
    reason: no_matching_rule

  - name: a manager sees every column of rmprep-v2-data
    action: data.query
    application: rmprep-v2-data
    resource: rmprep_v2.profile
    classification: confidential
    roles: [manager]
    expect: allow
    reason: rmprep-v2-data-managers-see-everything

  - name: an analyst reads rmprep-v2-data
    action: data.query
    application: rmprep-v2-data
    resource: rmprep_v2.profile
    classification: confidential
    roles: [analyst]
    expect: allow
    reason: rmprep-v2-data-analysts-read-the-data

  - name: rmprep-v2 uses its default model
    action: model.route
    application: rmprep-v2
    resource: default
    expect: allow
    reason: rmprep-v2-uses-its-models

  - name: rmprep-v2 may not call a tool no rule names
    action: tool.call
    application: rmprep-v2
    resource: delete_everything
    expect: deny
    reason: no_matching_rule

  - name: rmprep-v2 calls a tool of rmprep-v2-data
    action: tool.call
    application: rmprep-v2
    resource: "rmprep-v2-data/rmprep-v2-data.get_memo_evidence"
    classification: confidential
    expect: allow
    reason: rmprep-v2-calls-rmprep-v2-data
