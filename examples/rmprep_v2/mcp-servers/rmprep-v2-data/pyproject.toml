[project]
name = "rmprep-v2-data"
version = "0.1.0"
description = "Governed client evidence and review findings for relationship manager meeting preparation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agentcraft2-core[duckdb,jwt,mcp,otel,serve]>=0.1,<0.2",
]

[project.scripts]
rmprep-v2-data = "rmprep_v2_data.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmprep_v2_data"]
